<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gezeiten Vorhersage — Tide</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Tide — Gezeiten Vorhersage</h1>
    <p>Wähle eine Station, ein Datum und sieh Hoch-/Niedrigwasser sowie die Wasserstandskurve.</p>
  </header>

  <main class="container">
    <section class="controls">
      <label for="station">Station</label>
      <input id="stationSearch" placeholder="Suche Station..." />
      <select id="station" size="6" aria-label="Stationsliste"></select>

      <label for="date">Datum</label>
      <input type="date" id="date" />

      <div class="buttons">
        <button id="show">Anzeigen</button>
        <button id="downloadCsv">CSV herunterladen</button>
      </div>
    </section>

    <section class="details">
      <div id="stationMeta" class="meta"></div>

      <h2>Hoch- / Niedrigwasser</h2>
      <ul id="eventsList" class="events"></ul>

      <h2>Wasserstandskurve</h2>
      <canvas id="chart" height="200"></canvas>
    </section>
  </main>

  <footer class="site-footer">
    <small>Datenquelle: BSH WaterLevelForecast API</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
